<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Personal Tutor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-menu" class="screen">
        <h1 class="welcome-title">Welcome back! 👋</h1>
        <p class="welcome-sub">Your current level:<br><strong>Complete Beginner</strong></p>
        <div class="menu-buttons">
            <button class="menu-btn" onclick="showScreen('chat-screen')">💬 CHAT WITH TUTOR</button>
            <button class="menu-btn" onclick="document.getElementById('file-upload').click()">📚 UPLOAD LESSON FILE</button>
            <button class="menu-btn" onclick="showScreen('voice-screen')">🎙️ VOICE TUTOR (BETA)</button>
            <button class="menu-btn" onclick="alert('Coming soon!')">📊 MY PROGRESS</button>
        </div>
        <!-- Hidden File Input -->
        <input type="file" id="file-upload" accept=".txt" style="display:none;">
    </div>

    <div id="chat-screen" class="screen hidden">
        <header>
            <button class="back-btn" onclick="showScreen('main-menu')">❮</button>
            <div id="study-timer">⏱️ 00:00:00</div>
            <button id="clear-memory-chat" class="reset-btn">Reset</button>
        </header>
        <div id="chat-actions">
            <button id="make-notes-btn" class="action-btn">📝 Make Notes</button>
            <span id="lesson-status">No file uploaded</span>
        </div>
        <main id="chat-container"></main>
        <footer class="chat-footer">
            <input type="text" id="user-input" placeholder="Ask your tutor anything..." autocomplete="off">
            <button id="send-btn" class="round-btn">➤</button>
        </footer>
    </div>

    <div id="voice-screen" class="screen hidden">
        <header>
            <button class="back-btn" onclick="showScreen('main-menu')">❮</button>
            <h1>AI Voice Tutor</h1>
            <div style="width: 30px;"></div>
        </header>
        <main class="voice-main">
            <div id="character-box">
                <div class="character-face">
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                    <div class="mouth"></div>
                </div>
            </div>
            <p id="voice-status" class="voice-status">🎙️ Voice features coming soon...</p>
        </main>
        <footer class="voice-footer">
            <button id="mic-btn" class="menu-btn mic-large">🎤 TAP TO SPEAK</button>
        </footer>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
