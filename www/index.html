<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Personal Tutor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-menu" class="screen">
        <h1 class="welcome-title">Welcome back! 👋</h1>
        <p class="welcome-sub">Your current level:<br><strong>Complete Beginner</strong></p>
        <div class="menu-buttons">
            <button class="menu-btn" onclick="showScreen('voice-screen')">🎙️ SPEAK WITH TUTOR</button>
            <button class="menu-btn" onclick="showScreen('chat-screen')">💬 CHAT WITH TUTOR</button>
            <button class="menu-btn" onclick="alert('Coming soon!')">📚 UPLOAD LESSON FILE</button>
            <button class="menu-btn" onclick="alert('Coming soon!')">📊 MY PROGRESS</button>
        </div>
    </div>
    <div id="chat-screen" class="screen hidden">
        <header>
            <button class="back-btn" onclick="showScreen('main-menu')">❮</button>
            <select id="subject-selector">
                <option value="General Knowledge">🌍 General</option>
                <option value="English Language">🇬🇧 English</option>
                <option value="Mathematics">📐 Math</option>
                <option value="Science">🔬 Science</option>
                <option value="History">🏛️ History</option>
            </select>
            <button id="clear-memory-chat" class="reset-btn">Reset</button>
        </header>
        <div id="chat-actions">
            <button id="make-notes-btn" class="action-btn">📝 Make Notes</button>
        </div>
        <main id="chat-container"></main>
        <footer class="chat-footer">
            <input type="text" id="user-input" placeholder="Ask your tutor anything..." autocomplete="off">
            <button id="send-btn" class="round-btn">➤</button>
        </footer>
    </div>
    <div id="voice-screen" class="screen hidden">
        <header>
            <button class="back-btn" onclick="showScreen('main-menu')">❮</button>
            <h1>AI Voice Tutor</h1>
            <div style="width: 30px;"></div>
        </header>
        <main class="voice-main">
            <div id="character-box">
                <div class="character-face">
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                    <div class="mouth"></div>
                </div>
            </div>
            <p id="voice-status" class="voice-status">🎙️ Preparing voice conversation...</p>
        </main>
        <footer class="voice-footer">
            <button id="mic-btn" class="menu-btn mic-large">🎤 TAP TO SPEAK</button>
        </footer>
    </div>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
