<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI EduSchool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ONBOARDING -->
    <div id="onboarding-screen" class="screen hidden">
        <div class="onboarding-container">
            <h1>Welcome to AI EduSchool</h1>
            <p>Let's build your personalized learning path.</p>
            <label>What is your name?</label>
            <input type="text" id="onboard-name" placeholder="Enter your name">
            <label>What grade are you in?</label>
            <select id="onboard-grade">
                <option value="9">Grade 9</option>
                <option value="10">Grade 10</option>
                <option value="11">Grade 11</option>
                <option value="12">Grade 12</option>
            </select>
            <label>Select your Curriculum:</label>
            <select id="onboard-curriculum">
                <option value="Ethiopian National Curriculum">Ethiopian National Curriculum</option>
                <option value="International (IGCSE/IB)">International (IGCSE/IB)</option>
            </select>
            <button class="primary-btn" onclick="finishOnboarding()">Create My School</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-shell" class="screen hidden">
        
        <!-- DASHBOARD -->
        <div id="dashboard-screen" class="tab-content">
            <header class="dash-header">
                <div>
                    <h2>Hello, <span id="dash-name">Student</span>! 👋</h2>
                    <p id="dash-context">Grade 10 • Curriculum</p>
                </div>
                <div class="level-badge">Lvl <span id="dash-level">1</span></div>
            </header>
            <div class="xp-banner">
                <p>Daily Goal Progress</p>
                <div class="xp-progress-track"><div id="dash-xp-bar" class="xp-progress-fill"></div></div>
            </div>
            <h3>My Subjects</h3>
            <div class="subjects-grid">
                <div class="subject-card" onclick="openTutor('Math')">📐 Math</div>
                <div class="subject-card" onclick="openTutor('Physics')">🔭 Physics</div>
                <div class="subject-card" onclick="openTutor('Chemistry')">🧪 Chemistry</div>
                <div class="subject-card" onclick="openTutor('Biology')">🧬 Biology</div>
                <div class="subject-card" onclick="openTutor('English')">🇬🇧 English</div>
                <div class="subject-card" onclick="openTutor('History')">🏛️ History</div>
            </div>
        </div>

        <!-- TUTOR SCREEN (Gemini Style) -->
        <div id="tutor-screen" class="tab-content hidden">
            <header class="gemini-header">
                <button class="gemini-back" onclick="switchTab('dashboard-screen')">↩</button>
                <div class="gemini-title">
                    <span id="current-subject-title">Chemistry</span>
                </div>
                <button class="gemini-menu-btn">⋮</button>
            </header>

            <main id="chat-container"></main>

            <!-- Input Area -->
            <footer class="gemini-footer">
                <!-- Image Preview Area -->
                <div id="preview-area" class="preview-area hidden">
                    <div class="preview-chip">
                        <img id="preview-img" src="" alt="Preview">
                        <button onclick="clearPreview()">✕</button>
                    </div>
                </div>

                <div class="gemini-input-wrapper">
                    <button class="gemini-plus" onclick="toggleBottomSheet()">+</button>
                    <input type="text" id="user-input" placeholder="Ask Edu..." autocomplete="off">
                    <button class="gemini-mic">🎤</button>
                    <button id="send-btn" class="gemini-send">➤</button>
                </div>
            </footer>
            
            <!-- HIDDEN INPUTS -->
            <input type="file" id="camera-upload" accept="image/*" capture="environment" style="display:none;">
            <input type="file" id="gallery-upload" accept="image/*" style="display:none;">
            <input type="file" id="file-upload" accept=".txt,.pdf" style="display:none;">
        </div>

        <!-- PLANNER -->
        <div id="planner-screen" class="tab-content hidden">
            <header class="dash-header"><h2>Planner</h2></header>
            <div class="placeholder-content"><p>📅 Coming Soon</p></div>
        </div>

        <!-- PROFILE -->
        <div id="profile-screen" class="tab-content hidden">
            <header class="dash-header"><h2>Profile</h2></header>
            <div class="profile-card">
                <p><strong>Name:</strong> <span id="prof-name"></span></p>
                <p><strong>Grade:</strong> <span id="prof-grade"></span></p>
            </div>
            <button class="danger-btn" onclick="resetApp()">Erase All Data</button>
        </div>

        <!-- BOTTOM NAV (Hidden in Tutor) -->
        <nav id="main-nav" class="gemini-bottom-nav">
            <button id="nav-home" class="nav-item active" onclick="switchTab('dashboard-screen')">🏠<span>Home</span></button>
            <button id="nav-planner" class="nav-item" onclick="switchTab('planner-screen')">📅<span>Planner</span></button>
            <button id="nav-profile" class="nav-item" onclick="switchTab('profile-screen')">⚙️<span>Profile</span></button>
        </nav>
    </div>

    <!-- BOTTOM SHEET MODAL (+ MENU) -->
    <div id="bottom-sheet-overlay" class="sheet-overlay hidden" onclick="toggleBottomSheet()">
        <div class="bottom-sheet" onclick="event.stopPropagation()">
            <div class="sheet-handle"></div>
            <div class="sheet-grid">
                <button onclick="triggerUpload('camera-upload')"><span>📸</span> Camera</button>
                <button onclick="triggerUpload('gallery-upload')"><span>🖼️</span> Gallery</button>
                <button onclick="triggerUpload('file-upload')"><span>📎</span> Files</button>
                <button id="think-harder-btn" onclick="toggleThinkHarder()"><span>🧠</span> Think</button>
                <button onclick="handleQuickAction('quiz')"><span>📝</span> Quiz</button>
                <button onclick="handleQuickAction('feynman')"><span>🧑‍🏫</span> Feynman</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
